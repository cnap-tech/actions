name: Akua runner plan

on:
  workflow_call:
    inputs:
      control-plane-url:
        default: https://runner-control-plane.robinbraemer.workers.dev
        required: false
        type: string
      jobs-json:
        default: '{"linux_x64":"linux-x64","docker_x64":"docker-x64"}'
        required: false
        type: string
      oidc-audience:
        default: akua-runner-control-plane
        required: false
        type: string
    outputs:
      docker_x64:
        description: runs-on JSON for Docker-capable x64 jobs.
        value: ${{ jobs.plan.outputs.docker_x64 }}
      linux_x64:
        description: runs-on JSON for Linux x64 jobs.
        value: ${{ jobs.plan.outputs.linux_x64 }}
      runs_on_json:
        description: Object mapping requested job keys to runs-on JSON arrays.
        value: ${{ jobs.plan.outputs.runs_on_json }}

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    name: Runner plan
    runs-on: ubuntu-latest
    outputs:
      docker_x64: ${{ steps.plan.outputs.docker_x64 }}
      linux_x64: ${{ steps.plan.outputs.linux_x64 }}
      runs_on_json: ${{ steps.plan.outputs.runs_on_json }}
    steps:
      - id: plan
        env:
          AKUA_RUNNER_CONTROL_PLANE_URL: ${{ inputs.control-plane-url }}
          AKUA_RUNNER_JOBS_JSON: ${{ inputs.jobs-json }}
          AKUA_RUNNER_OIDC_AUDIENCE: ${{ inputs.oidc-audience }}
        run: |
          set -euo pipefail

          oidc_response="$(
            curl -fsS \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AKUA_RUNNER_OIDC_AUDIENCE}"
          )"
          oidc_token="$(jq -er '.value' <<<"$oidc_response")"

          payload="$(
            jq -n \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg runId "$GITHUB_RUN_ID" \
              --argjson jobs "$AKUA_RUNNER_JOBS_JSON" \
              '{
                repository: $repository,
                runId: $runId,
                jobs: $jobs
              }'
          )"

          response="$(
            curl -fsS \
              -H "Authorization: Bearer ${oidc_token}" \
              -H "Content-Type: application/json" \
              -d "$payload" \
              "${AKUA_RUNNER_CONTROL_PLANE_URL}/api/github/runner-plan"
          )"

          echo "runs_on_json=$(jq -c '.decisions | map_values(.runsOn)' <<<"$response")" >> "$GITHUB_OUTPUT"
          echo "linux_x64=$(jq -c '.decisions.linux_x64.runsOn // ["ubuntu-latest"]' <<<"$response")" >> "$GITHUB_OUTPUT"
          echo "docker_x64=$(jq -c '.decisions.docker_x64.runsOn // ["ubuntu-latest"]' <<<"$response")" >> "$GITHUB_OUTPUT"
