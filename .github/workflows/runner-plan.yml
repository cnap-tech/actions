name: Akua runner plan

on:
  workflow_call:
    inputs:
      control-plane-url:
        description: Deprecated compatibility input; ARC routing is resolved locally.
        default: ""
        required: false
        type: string
      jobs-json:
        default: '{"linux_x64":"linux-x64","docker_x64":"docker-x64"}'
        required: false
        type: string
      oidc-audience:
        description: Deprecated compatibility input; ARC routing is resolved locally.
        default: ""
        required: false
        type: string
    outputs:
      docker_x64:
        description: runs-on JSON for Docker-capable x64 jobs.
        value: ${{ jobs.plan.outputs.docker_x64 }}
      linux_x64:
        description: runs-on JSON for Linux x64 jobs.
        value: ${{ jobs.plan.outputs.linux_x64 }}
      runs_on_json:
        description: Object mapping requested job keys to runs-on JSON arrays.
        value: ${{ jobs.plan.outputs.runs_on_json }}

permissions:
  contents: read

jobs:
  plan:
    name: Runner plan
    runs-on: akua-x64-ci-v2
    outputs:
      docker_x64: ${{ steps.plan.outputs.docker_x64 }}
      linux_x64: ${{ steps.plan.outputs.linux_x64 }}
      runs_on_json: ${{ steps.plan.outputs.runs_on_json }}
    steps:
      - id: plan
        env:
          AKUA_RUNNER_JOBS_JSON: ${{ inputs.jobs-json }}
        run: |
          set -euo pipefail

          decisions="$(
            jq -cer '
              if type != "object" then
                error("jobs-json must be an object")
              else
                with_entries(
                  .value = (
                    if .value == "linux-x64" then ["akua-x64-ci-v2"]
                    elif .value == "docker-x64" then ["akua-docker-ci-v2"]
                    elif .value == "heavy-x64" then ["akua-heavy-ci-v2"]
                    else error("unsupported runner class: \(.value)")
                    end
                  )
                )
              end
            ' <<<"$AKUA_RUNNER_JOBS_JSON"
          )"

          echo "runs_on_json=$decisions" >> "$GITHUB_OUTPUT"
          echo "linux_x64=$(jq -c '.linux_x64 // ["akua-x64-ci-v2"]' <<<"$decisions")" >> "$GITHUB_OUTPUT"
          echo "docker_x64=$(jq -c '.docker_x64 // ["akua-docker-ci-v2"]' <<<"$decisions")" >> "$GITHUB_OUTPUT"
